name: YouTube health check

# Every day: can the app still read YouTube? Opens an issue if not (GitHub emails you),
# and closes it again once things work. YouTube often refuses GitHub's servers; then the
# result is "inconclusive" and nothing is reported (the app has its own warning banner).
on:
  schedule:
    - cron: "15 1 * * *" # 06:15 in Pakistan
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Run check
        id: run
        env:
          YT_HEALTH: "1"
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testReleaseUnitTest --tests '*HealthCheckTest*' --no-daemon > check.log 2>&1
          code=$?
          set -e
          dir=app/build/test-results/testReleaseUnitTest
          failures=$(grep -ho '<failure message="[^"]*"' $dir/*.xml 2>/dev/null | sed 's/<failure message="//; s/"$//' | head -5)
          skipped=$(grep -ho 'skipped="[0-9]*"' $dir/*HealthCheck*.xml 2>/dev/null | head -1 | grep -o '[0-9]*')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### YouTube health check"
            if [ "$code" = "0" ] && [ "${skipped:-0}" != "0" ]; then echo "Inconclusive: YouTube blocked GitHub's server (phones are not affected)."; 
            elif [ "$code" = "0" ]; then echo "All good: videos, media and search work."; 
            else echo "Failed:"; echo '```'; echo "${failures:-$(tail -30 check.log)}"; echo '```'; fi
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=YouTube health::$(sed -n 2p summary.md) $(echo "$failures" | head -1 | cut -c1-300)"
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="YouTube downloads may be broken"
          open=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')
          if [ "${{ steps.run.outputs.code }}" != "0" ]; then
            body="$(cat summary.md)

          The daily check couldn't read YouTube with the current version of the YouTube library.
          Downloads in the app will probably fail until it is updated.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "The check passes again ($(date -u +%F))."
          fi
