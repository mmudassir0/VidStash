name: Update YouTube library

# Every day: if a newer NewPipeExtractor (the library that reads YouTube) is out,
# switch to it, check that the app builds and still reads YouTube, then publish a new
# build. It then shows up in the app's update card.
on:
  schedule:
    - cron: "0 2 * * *" # 07:00 in Pakistan
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Find newest version
        id: ver
        run: |
          current=$(grep -o 'NewPipeExtractor:v[0-9.]*' app/build.gradle.kts | cut -d: -f2)
          latest=$(git ls-remote --tags https://github.com/TeamNewPipe/NewPipeExtractor | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "current=$current latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$current" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ver.outputs.newer == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: steps.ver.outputs.newer == 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: Switch, test and build
        if: steps.ver.outputs.newer == 'true'
        env:
          YT_HEALTH: "1"
        run: |
          sed -i "s/NewPipeExtractor:${{ steps.ver.outputs.current }}/NewPipeExtractor:${{ steps.ver.outputs.latest }}/" app/build.gradle.kts
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - name: Publish
        if: steps.ver.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "YT Downloader bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the YouTube library to ${{ steps.ver.outputs.latest }}

          Keeps downloads working after YouTube changes."
          git push
          # Pushes made by this workflow don't start other workflows by themselves.
          gh workflow run build.yml --ref "${{ github.ref_name }}"
