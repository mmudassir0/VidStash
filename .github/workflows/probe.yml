name: Probe
on:
  push:
    branches: [probe/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          exec > probe-out.txt 2>&1
          curl -sSfLO https://repo1.maven.org/maven2/de/sciss/jump3r/1.0.5/jump3r-1.0.5-sources.jar
          unzip -o -q jump3r-1.0.5-sources.jar -d src
          find src -name LameEncoder.java -exec cat {} \;
          echo "=== encode_buffer signatures"
          grep -n "public.*lame_encode\|public.*int lame_encode_buffer" -r src | head -20
          git rm -q --cached -r . >/dev/null 2>&1 || true
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add probe-out.txt; git commit -m "probe output"; git push
