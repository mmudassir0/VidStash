name: Probe build
on: push
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon > log.txt 2>&1 || true
          grep -E "^e: |error:|What went wrong|FAILED|AAPT|failure message" -A3 log.txt | head -80 > errors.txt
          grep -h -A6 "<failure" app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null | head -40 >> errors.txt || true
          git config user.name probe; git config user.email probe@example.com
          git add -f errors.txt; git commit -m "errors"; git push
