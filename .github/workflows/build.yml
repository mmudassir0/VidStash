name: Probe UI
on: push
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          chmod +x gradlew
          ./gradlew :app:recordPaparazziDebug --tests '*ScreensTest*' --no-daemon > shots-log.txt 2>&1 || echo "FAILED" >> shots-log.txt
          mkdir -p shots; cp app/src/test/snapshots/images/*.png shots/ 2>/dev/null || true
          ls shots >> shots-log.txt
          grep -h -A25 "<failure" app/build/test-results/testDebugUnitTest/*.xml | head -80 >> shots-log.txt || true
          git config user.name probe; git config user.email probe@example.com
          git add -f shots shots-log.txt; git commit -m "screenshots"; git push
