name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: "ubuntu-latest" moves to a new Ubuntu on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk YTDownloader.apk
      - uses: actions/upload-artifact@v7
        with:
          name: YTDownloader-apk
          path: YTDownloader.apk
      # Publishes the APK as a "latest" release so it can be downloaded directly on a phone.
      # Only builds of main are published; other branches just check that the app builds.
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: build-${{ github.run_number }}
          name: YT Downloader build ${{ github.run_number }}
          make_latest: true
          # Shown as "What's new" by the in-app updater
          body: ${{ github.event.head_commit.message }}
          files: YTDownloader.apk
