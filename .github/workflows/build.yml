name: Probe tests
on: push
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon > test-log.txt 2>&1 || echo "FAILED" >> test-log.txt
          cat app/build/test-results/testReleaseUnitTest/*.xml > test-results.txt 2>&1 || echo "no results" > test-results.txt
          git config user.name probe; git config user.email probe@example.com
          git add -f test-log.txt test-results.txt; git commit -m "results"; git push
